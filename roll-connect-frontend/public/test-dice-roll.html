<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dice Roll Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .dice-display {
            font-size: 100px;
            margin: 30px;
            padding: 30px;
            background: #f0f0f0;
            border-radius: 20px;
            display: inline-block;
            min-width: 150px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .player-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .players-list {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .player-card {
            padding: 10px;
            margin: 5px;
            border-left: 5px solid;
            background: white;
            text-align: left;
        }
        .player-card.red { border-color: #e74c3c; }
        .player-card.blue { border-color: #3498db; }
        .player-card.green { border-color: #2ecc71; }
        .player-card.yellow { border-color: #f39c12; }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        input {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>🎲 Dice Roll Test</h1>

    <!-- Setup -->
    <div id="setup">
        <h2>Setup Game</h2>
        <input type="text" id="playerName" placeholder="Your Name">
        <button onclick="quickStartGame()">Quick Start (2 Players)</button>
        <br><br>
        <input type="text" id="joinGameId" placeholder="Game ID to Join">
        <input type="text" id="joinPlayerName" placeholder="Your Name">
        <button onclick="joinExistingGame()">Join Existing Game</button>
    </div>

    <!-- Game -->
    <div id="game" style="display:none;">
        <div class="player-info">
            <h3>🎮 Current Turn: <span id="currentPlayer" style="font-weight:bold;"></span></h3>
            <p>Game ID: <span id="displayGameId"></span></p>
            <p>Your Name: <span id="yourName"></span></p>
            <p>Your Turn: <span id="yourTurnIndicator">⏳ Waiting...</span></p>
        </div>

        <div class="dice-display" id="diceDisplay">?</div>

        <button id="rollBtn" onclick="rollDice()">🎲 Roll Dice</button>
        <button onclick="nextTurn()" style="background:#2196F3;">➡️ Next Turn</button>

        <div class="players-list">
            <h3>Players:</h3>
            <div id="playersList"></div>
        </div>
    </div>

    <div id="messages"></div>

    <script>
        const API_URL = 'http://localhost:5000';
        let socket;
        let currentGameId;
        let currentPlayerName;
        let gameData = null;

        // Quick start with 2 players
        async function quickStartGame() {
            const playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                showMessage('Enter your name!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/game/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: 'offline',
                        offlinePlayers: [playerName, 'Bot']
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    currentGameId = result.data.gameId;
                    currentPlayerName = playerName;
                    gameData = result.data;
                    
                    showGameScreen();
                    updateGameDisplay();
                    
                    showMessage('✅ Game started!', 'success');
                } else {
                    showMessage('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }

        // Join existing game
        async function joinExistingGame() {
            const gameId = document.getElementById('joinGameId').value.trim();
            const playerName = document.getElementById('joinPlayerName').value.trim();

            if (!gameId || !playerName) {
                showMessage('Enter Game ID and Name!', 'error');
                return;
            }

            try {
                // First, get game details
                const response = await fetch(`${API_URL}/api/game/${gameId}`);
                const result = await response.json();

                if (response.ok) {
                    currentGameId = gameId;
                    currentPlayerName = playerName;
                    gameData = result.data;

                    showGameScreen();
                    updateGameDisplay();

                    // Connect socket
                    initSocket();
                    
                    showMessage('✅ Joined game!', 'success');
                } else {
                    showMessage('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }

        function showGameScreen() {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('displayGameId').textContent = currentGameId;
            document.getElementById('yourName').textContent = currentPlayerName;
        }

        function updateGameDisplay() {
            if (!gameData) return;

            // Update current player
            const currentPlayer = gameData.players[gameData.currentTurn];
            document.getElementById('currentPlayer').textContent = 
                `${currentPlayer.playerName} (${currentPlayer.color})`;
            document.getElementById('currentPlayer').style.color = currentPlayer.color;

            // Update "your turn" indicator
            const isYourTurn = currentPlayer.playerName === currentPlayerName;
            const indicator = document.getElementById('yourTurnIndicator');
            if (isYourTurn) {
                indicator.textContent = '✅ Your Turn!';
                indicator.style.color = 'green';
                indicator.style.fontWeight = 'bold';
                document.getElementById('rollBtn').disabled = false;
            } else {
                indicator.textContent = '⏳ Waiting for turn...';
                indicator.style.color = '#666';
                indicator.style.fontWeight = 'normal';
                document.getElementById('rollBtn').disabled = true;
            }

            // Update dice display
            if (gameData.diceValue) {
                document.getElementById('diceDisplay').textContent = gameData.diceValue;
            }

            // Update players list
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '';
            gameData.players.forEach((player, index) => {
                const div = document.createElement('div');
                div.className = `player-card ${player.color}`;
                const isCurrent = index === gameData.currentTurn;
                div.innerHTML = `
                    <strong>${player.playerName}</strong> - ${player.color}
                    ${isCurrent ? '👈 <b>Current Turn</b>' : ''}
                `;
                playersList.appendChild(div);
            });
        }

        // Initialize Socket.io
        function initSocket() {
            if (socket) return; // Already connected

            socket = io(API_URL);

            socket.on('connect', () => {
                console.log('✅ Socket connected');
                showMessage('✅ Connected to server', 'success');
            });

            socket.on('dice-rolled', (data) => {
                console.log('Dice rolled:', data);
                document.getElementById('diceDisplay').textContent = data.diceValue;
                showMessage(`🎲 ${data.message}`, 'success');
                
                // Refresh game state
                refreshGameState();
            });

            socket.on('error', (data) => {
                showMessage('❌ ' + data.message, 'error');
            });
        }

        // Roll dice
        async function rollDice() {
            if (!currentGameId || !currentPlayerName) {
                showMessage('No active game!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/dice/roll`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        gameId: currentGameId,
                        playerName: currentPlayerName
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    document.getElementById('diceDisplay').textContent = result.data.diceValue;
                    showMessage(`🎲 ${result.message}`, 'success');
                    
                    // Refresh game state after rolling
                    await refreshGameState();
                } else {
                    showMessage('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }

        // Move to next turn (temporary - simulates turn management)
        async function nextTurn() {
            if (!currentGameId) {
                showMessage('No active game!', 'error');
                return;
            }

            try {
                // Manually update turn for testing
                const nextTurnIndex = (gameData.currentTurn + 1) % gameData.players.length;
                
                // In real implementation, this will be done by backend after pawn movement
                // For now, we'll fetch fresh game state
                await refreshGameState();
                
                // Temporarily update locally
                gameData.currentTurn = nextTurnIndex;
                updateGameDisplay();
                
                showMessage('➡️ Next turn!', 'info');
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }

        // Refresh game state from server
        async function refreshGameState() {
            try {
                const response = await fetch(`${API_URL}/api/game/${currentGameId}`);
                const result = await response.json();

                if (response.ok) {
                    gameData = result.data;
                    updateGameDisplay();
                }
            } catch (error) {
                console.error('Error refreshing game state:', error);
            }
        }

        function showMessage(msg, type) {
            const div = document.getElementById('messages');
            const p = document.createElement('div');
            p.className = `message ${type}`;
            p.textContent = msg;
            div.insertBefore(p, div.firstChild);
            setTimeout(() => p.remove(), 5000);
        }
    </script>
</body>
</html>
