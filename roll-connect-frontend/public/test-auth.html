<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roll-Connect Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .login-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        input, button {
            padding: 12px;
            margin: 10px 0;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        button {
            background: #4285f4;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #357ae8;
        }
        .guest-btn {
            background: #34a853;
        }
        .guest-btn:hover {
            background: #2d9247;
        }
        #userInfo {
            background: #e8f5e9;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🎲 Roll-Connect Login</h1>

    <!-- Guest Login -->
    <div class="login-section">
        <h2>Continue as Guest</h2>
        <input type="text" id="guestUsername" placeholder="Enter your username">
        <button class="guest-btn" onclick="guestLogin()">Continue as Guest</button>
    </div>

    <!-- Google Login -->
    <div class="login-section">
        <h2>Login with Google</h2>
        <button onclick="googleLogin()">
            <span>🔐 Sign in with Google</span>
        </button>
    </div>

    <!-- User Info Display -->
    <div id="userInfo">
        <h3>✅ Logged In!</h3>
        <p><strong>User ID:</strong> <span id="userId"></span></p>
        <p><strong>Username:</strong> <span id="username"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>Auth Type:</strong> <span id="authType"></span></p>
        <p><strong>Total Wins:</strong> <span id="totalWins"></span></p>
        <p><strong>Coins:</strong> <span id="coins"></span></p>
        <button onclick="logout()" style="background:#dc3545;">Logout</button>
    </div>

    <!-- Messages -->
    <div id="messages"></div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Check if user is already logged in on page load
        window.onload = async () => {
            // Check URL for user data (from Google redirect)
            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('user');
            
            if (userParam) {
                try {
                    const user = JSON.parse(decodeURIComponent(userParam));
                    displayUserInfo(user);
                    // Clean URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (e) {
                    console.error('Error parsing user data:', e);
                }
            }

            // Check session
            await checkAuthStatus();
        };

        // Guest Login
        async function guestLogin() {
            const username = document.getElementById('guestUsername').value.trim();

            if (!username) {
                showMessage('Please enter a username', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/guest`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Guest login successful!', 'success');
                    displayUserInfo(result.data);
                } else {
                    showMessage(result.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Google Login
        function googleLogin() {
            // Redirect to Google OAuth
            window.location.href = `${API_URL}/auth/google`;
        }

        // Check if user is authenticated
        async function checkAuthStatus() {
            try {
                const response = await fetch(`${API_URL}/auth/check`, {
                    credentials: 'include'
                });
                const result = await response.json();

                if (result.authenticated) {
                    displayUserInfo(result.user);
                }
            } catch (error) {
                console.error('Error checking auth status:', error);
            }
        }

        // Logout
        async function logout() {
            try {
                const response = await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage('Logged out successfully', 'success');
                    document.getElementById('userInfo').style.display = 'none';
                    document.getElementById('guestUsername').value = '';
                } else {
                    showMessage('Logout failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Display user info
        function displayUserInfo(user) {
            document.getElementById('userId').textContent = user.userId;
            document.getElementById('username').textContent = user.username;
            document.getElementById('email').textContent = user.email || 'N/A (Guest)';
            document.getElementById('authType').textContent = user.authType;
            document.getElementById('totalWins').textContent = user.totalWins || 0;
            document.getElementById('coins').textContent = user.coins || 0;
            document.getElementById('userInfo').style.display = 'block';
        }

        // Show message
        function showMessage(msg, type) {
            const div = document.getElementById('messages');
            const p = document.createElement('div');
            p.className = `message ${type}`;
            p.textContent = msg;
            div.appendChild(p);

            setTimeout(() => p.remove(), 5000);
        }
    </script>
</body>
</html>
