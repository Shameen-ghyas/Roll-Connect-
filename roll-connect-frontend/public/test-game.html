<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll Connect - Complete Game Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
        }
        
        .section h2 {
            color: #555;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .btn-warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .btn-danger { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        
        .game-info {
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
        }
        
        .game-info.active {
            display: block;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 6px;
        }
        
        .info-label {
            font-weight: bold;
            color: #555;
        }
        
        .info-value {
            color: #333;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .player-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .player-card.red { border-color: #e74c3c; background: #ffebee; }
        .player-card.blue { border-color: #3498db; background: #e3f2fd; }
        .player-card.green { border-color: #2ecc71; background: #e8f5e9; }
        .player-card.yellow { border-color: #f39c12; background: #fff8e1; }
        
        .player-card.current-turn {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
            transform: scale(1.05);
        }
        
        .player-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .pawns-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        
        .pawn {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid #ddd;
            transition: all 0.2s;
        }
        
        .pawn:hover {
            transform: scale(1.1);
            border-color: #667eea;
        }
        
        .pawn.at-home {
            background: #4caf50;
            color: white;
            font-weight: bold;
        }
        
        .pawn.at-start {
            background: #f44336;
            color: white;
        }
        
        .dice-container {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-radius: 15px;
            margin: 20px 0;
        }
        
        .dice-display {
            font-size: 80px;
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 15px;
            display: inline-block;
            min-width: 120px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .messages {
            max-height: 300px;
            overflow-y: auto;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .msg-success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .msg-error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .msg-info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
        .msg-warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        .msg-capture { background: #ffe5e5; color: #c41e3a; border-left: 4px solid #ff1744; font-weight: bold; }
        .msg-finish { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; font-weight: bold; }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
        }
        
        .connected {
            background: #4caf50;
            color: white;
        }
        
        .disconnected {
            background: #f44336;
            color: white;
        }
        
        .rankings {
            background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            color: white;
            display: none;
        }
        
        .rankings.active {
            display: block;
        }
        
        .rank-item {
            background: rgba(255,255,255,0.9);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
        }
        
        .rank-badge {
            font-size: 2em;
            font-weight: bold;
        }
        
        .rank-1 .rank-badge { color: #ffd700; }
        .rank-2 .rank-badge { color: #c0c0c0; }
        .rank-3 .rank-badge { color: #cd7f32; }
    </style>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">⚠️ Not Connected</div>
    
    <div class="container">
        <h1>🎲 Roll Connect - Complete Game Test</h1>
        <p class="subtitle">Test all game rules: Movement, Capture, Ranking, Win Detection</p>
        
        <!-- Setup Section -->
        <div class="grid" id="setupSection">
            <div class="section">
                <h2>🎮 Create Game</h2>
                <input type="text" id="createName" placeholder="Your Name" value="Alice">
                <select id="gameMode">
                    <option value="offline">Offline Mode</option>
                    <option value="online">Online Mode</option>
                </select>
                <div id="offlinePlayersDiv">
                    <input type="text" id="player2" placeholder="Player 2 Name" value="Bob">
                    <input type="text" id="player3" placeholder="Player 3 Name" value="Carol">
                    <input type="text" id="player4" placeholder="Player 4 Name" value="Dave">
                </div>
                <button onclick="createGame()" class="btn-success">Create Game</button>
            </div>
            
            <div class="section">
                <h2>🔗 Join Game</h2>
                <input type="text" id="joinGameId" placeholder="Game ID">
                <input type="text" id="joinName" placeholder="Your Name" value="Bob">
                <button onclick="joinGame()" class="btn-success">Join Game</button>
            </div>
        </div>
        
        <!-- Game Info -->
        <div class="game-info" id="gameInfo">
            <h2>📋 Game Information</h2>
            <div class="info-row">
                <span class="info-label">Game ID:</span>
                <span class="info-value" id="displayGameId">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Mode:</span>
                <span class="info-value" id="displayMode">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Status:</span>
                <span class="info-value" id="displayStatus">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Your Name:</span>
                <span class="info-value" id="displayYourName">-</span>
            </div>
            <button onclick="startGame()" id="startBtn" class="btn-warning">🚀 Start Game</button>
        </div>
        
        <!-- Dice Section -->
        <div class="dice-container" id="diceSection" style="display:none;">
            <h2>🎲 Dice Roll</h2>
            <div class="dice-display" id="diceDisplay">?</div>
            <button onclick="rollDice()" id="rollBtn" class="btn-success">Roll Dice</button>
           
        
        <!-- Players Display -->
        <div class="section" id="playersSection" style="display:none;">
            <h2>👥 Players</h2>
            <div class="players-grid" id="playersGrid"></div>
        </div>
        
        <!-- Rankings -->
        <div class="rankings" id="rankingsSection">
            <h2>🏆 Final Rankings</h2>
            <div id="rankingsList"></div>
        </div>
        
        <!-- Messages -->
        <div class="messages" id="messages"></div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5000';
        let socket;
        let currentGameId = null;
        let currentPlayerName = null;
        let currentGameData = null;
        
        // Initialize socket connection
        function initSocket() {
            if (socket) return;
            
            socket = io(API_URL);
            
            socket.on('connect', () => {
                console.log('✅ Socket connected:', socket.id);
                document.getElementById('connectionStatus').className = 'connection-status connected';
                document.getElementById('connectionStatus').textContent = '✅ Connected';
                showMessage('Connected to server!', 'success');
            });
            
            socket.on('disconnect', () => {
                console.log('❌ Socket disconnected');
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
                document.getElementById('connectionStatus').textContent = '❌ Disconnected';
                showMessage('Disconnected from server', 'error');
            });
            
            socket.on('player-joined', (data) => {
                console.log('Player joined:', data);
                showMessage(`🎮 ${data.newPlayer} joined the game!`, 'success');
                updateGameDisplay(data);
            });
            
            socket.on('game-started', (data) => {
                console.log('Game started:', data);
                showMessage(`🚀 ${data.message}`, 'success');
                currentGameData = data;
                document.getElementById('displayStatus').textContent = data.gameStatus;
                document.getElementById('diceSection').style.display = 'block';
                document.getElementById('playersSection').style.display = 'block';
                document.getElementById('startBtn').disabled = true;
                updatePlayersDisplay(data.players, data.currentTurn);
            });
            
            socket.on('dice-rolled', (data) => {
                console.log('Dice rolled:', data);
                document.getElementById('diceDisplay').textContent = data.diceValue;
                showMessage(`🎲 ${data.message}`, 'info');
            });
            
            socket.on('pawn-moved', (data) => {
                console.log('Pawn moved:', data);
                showMessage(`🎯 ${data.message}`, 'info');
                refreshGameState();
            });
            
            socket.on('pawn-captured', (data) => {
                console.log('Pawn captured:', data);
                showMessage(`💥 ${data.message}`, 'capture');
                refreshGameState();
            });
            
            socket.on('player-finished', (data) => {
                console.log('Player finished:', data);
                showMessage(`🎉 ${data.message}`, 'finish');
                refreshGameState();
            });
            
            socket.on('game-over', (data) => {
                console.log('Game over:', data);
                showMessage(`🏁 ${data.message}`, 'finish');
                displayRankings(data.rankings);
                document.getElementById('diceSection').style.display = 'none';
            });
            
            socket.on('turn-changed', (data) => {
                console.log('Turn changed:', data);
                showMessage(`➡️ ${data.message}`, 'warning');
                if (currentGameData) {
                    currentGameData.currentTurn = data.currentTurn;
                    refreshGameState();
                }
            });
            
            socket.on('extra-turn-granted', (data) => {
                console.log('Extra turn:', data);
                showMessage(`🎁 ${data.message}`, 'warning');
            });
            
            socket.on('error', (data) => {
                console.error('Socket error:', data);
                showMessage('❌ ' + data.message, 'error');
            });
        }
        
        // Create game
        async function createGame() {
            const playerName = document.getElementById('createName').value.trim();
            const mode = document.getElementById('gameMode').value;
            
            if (!playerName) {
                showMessage('Enter your name!', 'error');
                return;
            }
            
            let body = { mode };
            
            if (mode === 'offline') {
                const p2 = document.getElementById('player2').value.trim();
                const p3 = document.getElementById('player3').value.trim();
                const p4 = document.getElementById('player4').value.trim();
                
                const players = [playerName, p2, p3, p4].filter(n => n);
                
                if (players.length < 2) {
                    showMessage('Need at least 2 players!', 'error');
                    return;
                }
                
                body.offlinePlayers = players;
            } else {
                body.playerName = playerName;
            }
            
            try {
                const response = await fetch(`${API_URL}/api/game/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    currentGameId = result.data.gameId;
                    currentPlayerName = playerName;
                    currentGameData = result.data;
                    
                    document.getElementById('displayGameId').textContent = currentGameId;
                    document.getElementById('displayMode').textContent = result.data.mode;
                    document.getElementById('displayStatus').textContent = result.data.gameStatus;
                    document.getElementById('displayYourName').textContent = playerName;
                    document.getElementById('gameInfo').classList.add('active');
                    document.getElementById('joinGameId').value = currentGameId;
                    
                    if (mode === 'offline') {
                        document.getElementById('startBtn').style.display = 'block';
                        document.getElementById('diceSection').style.display = 'block';
                        document.getElementById('playersSection').style.display = 'block';
                        updatePlayersDisplay(result.data.players, result.data.currentTurn);
                    } else {
                        if (!socket) initSocket();
                        setTimeout(() => {
                            socket.emit('join-game', { gameId: currentGameId, playerName });
                        }, 500);
                    }
                    
                    showMessage('✅ Game created!', 'success');
                } else {
                    showMessage('❌ ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            }
        }
        
        // Join game
        function joinGame() {
            const gameId = document.getElementById('joinGameId').value.trim();
            const playerName = document.getElementById('joinName').value.trim();
            
            if (!gameId || !playerName) {
                showMessage('Enter Game ID and Name!', 'error');
                return;
            }
            
            currentGameId = gameId;
            currentPlayerName = playerName;
            
            document.getElementById('displayGameId').textContent = gameId;
            document.getElementById('displayYourName').textContent = playerName;
            document.getElementById('gameInfo').classList.add('active');
            
            if (!socket) initSocket();
            
            setTimeout(() => {
                socket.emit('join-game', { gameId, playerName });
            }, 500);
            
            showMessage('Joining game...', 'info');
        }
        
        // Start game
        function startGame() {
            if (!currentGameId) {
                showMessage('No active game!', 'error');
                return;
            }
            
            if (currentGameData && currentGameData.mode === 'offline') {
                // Offline mode - already started
                showMessage('Offline game already active!', 'info');
                return;
            }
            
            socket.emit('start-game', { gameId: currentGameId });
            showMessage('Starting game...', 'info');
        }
        
        // Roll dice
        // Roll dice
function rollDice() {
    if (!currentGameId || !currentPlayerName) {
        showMessage('No active game!', 'error');
        return;
    }
    
    // Disable button to prevent multiple clicks
    const rollBtn = document.getElementById('rollBtn');
    rollBtn.disabled = true;
    rollBtn.textContent = 'Rolling...';
    
    if (currentGameData.mode === 'offline') {
        // REST API for offline
        fetch(`${API_URL}/api/dice/roll`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                gameId: currentGameId,
                playerName: getCurrentTurnPlayer()
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                document.getElementById('diceDisplay').textContent = data.data.diceValue;
                showMessage(`🎲 ${data.message}`, 'info');
                
                // Re-enable button after 1 second
                setTimeout(() => {
                    rollBtn.disabled = false;
                    rollBtn.textContent = 'Roll Dice';
                }, 1000);
                
                refreshGameState();
            } else {
                showMessage('❌ ' + (data.error || data.message), 'error');
                rollBtn.disabled = false;
                rollBtn.textContent = 'Roll Dice';
            }
        })
        .catch(error => {
            showMessage('❌ Error: ' + error.message, 'error');
            rollBtn.disabled = false;
            rollBtn.textContent = 'Roll Dice';
        });
    } else {
        // Socket for online
        socket.emit('roll-dice', { gameId: currentGameId, playerName: currentPlayerName });
        
        // Re-enable button after 1 second
        setTimeout(() => {
            rollBtn.disabled = false;
            rollBtn.textContent = 'Roll Dice';
        }, 1000);
    }
}        
        // Move pawn
        function movePawn(pawnId) {
            if (!currentGameId || !currentPlayerName) {
                showMessage('No active game!', 'error');
                return;
            }
            
            const currentPlayer = getCurrentTurnPlayer();
            
            if (currentGameData.mode === 'offline') {
                // Use socket even for offline for consistent behavior
                if (!socket) initSocket();
                setTimeout(() => {
                    socket.emit('move-pawn', {
                        gameId: currentGameId,
                        playerName: currentPlayer,
                        pawnId: pawnId
                    });
                }, 300);
            } else {
                socket.emit('move-pawn', {
                    gameId: currentGameId,
                    playerName: currentPlayerName,
                    pawnId: pawnId
                });
            }
        }
        
        // Next turn
        function nextTurn() {
            if (!currentGameId) {
                showMessage('No active game!', 'error');
                return;
            }
            
            if (currentGameData.mode === 'offline') {
                fetch(`${API_URL}/api/turn/next`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gameId: currentGameId })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        showMessage(`➡️ ${data.message}`, 'warning');
                        refreshGameState();
                    }
                });
            } else {
                socket.emit('next-turn', { gameId: currentGameId });
            }
        }
        
        // Refresh game state
        async function refreshGameState() {
            if (!currentGameId) return;
            
            try {
                const response = await fetch(`${API_URL}/api/game/${currentGameId}`);
                const result = await response.json();
                
                if (response.ok) {
                    currentGameData = result.data;
                    updatePlayersDisplay(result.data.players, result.data.currentTurn);
                    
                    if (result.data.diceValue) {
                        document.getElementById('diceDisplay').textContent = result.data.diceValue;
                    }
                }
            } catch (error) {
                console.error('Error refreshing state:', error);
            }
        }
        
        // Update players display
        function updatePlayersDisplay(players, currentTurn) {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = '';
            
            players.forEach((player, index) => {
                const card = document.createElement('div');
                card.className = `player-card ${player.color}`;
                if (index === currentTurn) {
                    card.classList.add('current-turn');
                }
                
                let rankBadge = '';
                if (player.rank) {
                    const medals = { 1: '🥇', 2: '🥈', 3: '🥉', 4: '4️⃣' };
                    rankBadge = `<div style="font-size: 2em;">${medals[player.rank]}</div>`;
                }
                
                card.innerHTML = `
                    ${rankBadge}
                    <div class="player-name">${player.playerName}</div>
                    <div>Color: <strong>${player.color.toUpperCase()}</strong></div>
                    ${index === currentTurn ? '<div style="color: #667eea; font-weight: bold;">🎯 CURRENT TURN</div>' : ''}
                    <div class="pawns-container">
                        ${player.pawns.map(pawn => `
                            <div class="pawn ${pawn.isHome ? 'at-home' : pawn.position === -1 ? 'at-start' : ''}" 
                                 onclick="movePawn(${pawn.pawnId})"
                                 title="Pawn ${pawn.pawnId}: Position ${pawn.position}">
                                <div style="font-size: 0.8em;">P${pawn.pawnId}</div>
                                <div style="font-size: 1.2em; font-weight: bold;">
                                    ${pawn.isHome ? '🏠' : pawn.position === -1 ? '🔴' : pawn.position}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // Display rankings
        function displayRankings(rankings) {
            const section = document.getElementById('rankingsSection');
            const list = document.getElementById('rankingsList');
            
            list.innerHTML = '';
            
            rankings.forEach(player => {
                const item = document.createElement('div');
                item.className = `rank-item rank-${player.rank}`;
                
                const medals = { 1: '🥇', 2: '🥈', 3: '🥉', 4: '4️⃣' };
                
                item.innerHTML = `<div>
                    <div class="rank-badge">${medals[player.rank]}</div>
                </div>
                <div>
                    <div style="font-size: 1.3em; font-weight: bold;">${player.playerName}</div>
                    <div style="color: #666;">Color: ${player.color.toUpperCase()}</div>
                </div>
                <div style="font-size: 1.5em; font-weight: bold;">
                    Rank ${player.rank}
                </div>
            `;
            
            list.appendChild(item);
        });
        
        section.classList.add('active');
    }
    
    // Update game display
    function updateGameDisplay(data) {
        document.getElementById('displayGameId').textContent = data.gameId;
        document.getElementById('displayMode').textContent = data.mode;
        document.getElementById('displayStatus').textContent = data.gameStatus;
        document.getElementById('gameInfo').classList.add('active');
        
        if (data.players && data.players.length >= 2) {
            document.getElementById('startBtn').disabled = false;
        }
        
        if (data.players) {
            updatePlayersDisplay(data.players, data.currentTurn || 0);
            document.getElementById('playersSection').style.display = 'block';
        }
    }
    
    // Get current turn player name
    function getCurrentTurnPlayer() {
        if (!currentGameData || !currentGameData.players) return currentPlayerName;
        return currentGameData.players[currentGameData.currentTurn].playerName;
    }
    
    // Show message
    function showMessage(msg, type) {
        const div = document.getElementById('messages');
        const msgEl = document.createElement('div');
        msgEl.className = `message msg-${type}`;
        
        const time = new Date().toLocaleTimeString();
        msgEl.innerHTML = `<strong>[${time}]</strong> ${msg}`;
        
        div.insertBefore(msgEl, div.firstChild);
        
        // Keep only last 50 messages
        while (div.children.length > 50) {
            div.removeChild(div.lastChild);
        }
        
        // Auto-scroll to top
        div.scrollTop = 0;
    }
    
    // Auto-initialize socket for online mode
    window.onload = () => {
        showMessage('Welcome to Roll Connect! Create or join a game to start.', 'info');
    };
    
    // Handle game mode change
    document.getElementById('gameMode').addEventListener('change', (e) => {
        const offlineDiv = document.getElementById('offlinePlayersDiv');
        if (e.target.value === 'offline') {
            offlineDiv.style.display = 'block';
        } else {
            offlineDiv.style.display = 'none';
        }
    });
    </script>
</body>
</html>
