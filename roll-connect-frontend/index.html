<body>
  <h1> Roll Connect Test Interface</h1>

  <label>Enter Player Name:</label>
  <input type="text" id="playerName" placeholder="Your name" />

  <br />

  <label>Select Mode:</label>
  <select id="gameMode">
    <option value="offline">Offline</option>
    <option value="online">Online</option>
  </select>

  <br />

  <label>Enter Score:</label>
  <input type="number" id="score" placeholder="Score" />

  <br />

  <label>Enter Wins:</label>
  <input type="number" id="wins" placeholder="Wins" />

  <br />
  <button onclick="submitPlayer()">Submit</button>

  <div id="response"></div>

  <script>
    async function submitPlayer() {
      const playerName = document.getElementById('playerName').value;
      const score = parseInt(document.getElementById('score').value);
      const wins = parseInt(document.getElementById('wins').value);

      if (!playerName) {
        alert('Please enter a name!');
        return;
      }

      const data = { playerName, score, wins };

      try {
        const res = await fetch('http://localhost:5000/api/leaderboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        document.getElementById('response').innerText =
          ' Player saved: ' + JSON.stringify(result);
      } catch (err) {
        document.getElementById('response').innerText = 'Failed to connect to backend';
      }
    }
  </script>
</body>
